services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: formforge, POSTGRES_USER: formforge, POSTGRES_PASSWORD: formforge_secret }
    ports: ["5436:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U formforge"], interval: 5s, timeout: 5s, retries: 10 }
  backend:
    build: ./backend
    ports: ["3002:3002"]
    environment:
      DATABASE_URL: postgresql://formforge:formforge_secret@db:5432/formforge
      DATABASE_SSL: "false"
      JWT_SECRET: ${FORMFORGE_JWT_SECRET:?Set FORMFORGE_JWT_SECRET}
      FRONTEND_URL: http://localhost:5174
      APP_URL: ${APP_URL:-http://localhost:5174}
      PORT: 3002
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
